<div class="blog-preview" [class.mobile]="isMobile | async">
  @if (blog.image?.formats; as formats) {
    <div class="image-container">
      <img
        (click)="openImage(formats)"
        class="image"
        [src]="
          strapiService.getStrapiImageUrl(
            formats,
            (isMobile | async) ? 'small' : 'xlarge'
          )
        "
        alt="blog image"
      />
    </div>
  }
  <div class="content">
    <span>{{ blog.date | date: 'dd.MM.yyyy, hh:mm' }}</span>
    <h2 class="title">{{ blog.title }}</h2>
    @if (blog.subTitle) {
      <h4 class="subtitile">
        {{ blog.subTitle }}
      </h4>
    }
    <p class="text" [innerHTML]="blog.content | markdown"></p>
  </div>
</div>
