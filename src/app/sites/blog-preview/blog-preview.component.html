<div class="blog-preview-container">
  <div class="background"></div>
  <h1 class="heading" [class.mobile]="isMobile | async">
    {{ 'blogPreview.title' | translate }}
  </h1>
  <div class="preview-container" [class.mobile]="isMobile | async">
    @for (blog of blogEntries; track blog; let i = $index) {
      <div
        class="blog-preview"
        [class.visible]="visible && i > 0"
        [class.mobile]="isMobile | async"
        [routerLink]="'/' + routes.BLOG"
      >
        @if (blog?.attributes) {
          <ng-container>
            <img
              class="image"
              [src]="blog | imageUrl: 'small'"
              alt="blog image"
            />
          </ng-container>
          <ng-template #placeholder>
            <img
              class="image"
              src="assets/images/placeholder.png"
              alt="placeholder"
            />
          </ng-template>
          <div class="content">
            <span>{{ blog.attributes.date | date: 'dd.MM.YYYY' }}</span>
            <h3 class="title">{{ blog.attributes.title }}</h3>
            @if (blog.attributes.subTitle) {
              <h4 class="subtitile">
                {{ blog.attributes.subTitle }}
              </h4>
            }
            <button class="btn icon-btn read-button">
              {{ 'blogPreview.readMore' | translate }}
              <i-bs name="chevron-right" width="20" height="20"> </i-bs>
            </button>
          </div>
        } @else {
          <!-- Skip rendering entries without attributes -->
        }
      </div>
    }
  </div>
  <button class="btn icon-btn read-all-button" [routerLink]="'/' + routes.BLOG">
    {{ 'blogPreview.showAll' | translate }}
    <i-bs name="chevron-right" width="20" height="20"> </i-bs>
  </button>
</div>
